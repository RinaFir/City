<body>
  <main class="city" aria-label="Ночной футуристический город">

    <section class="district" aria-label="Здания и фасады">

        <div class="building-floors">
          <div class="floor"><i class="window "></i><i class="window lit"></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window lit"></i><i class="window "></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window "></i><i class="window lit"></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window lit"></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window lit"></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window lit"></i><i class="window "></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window "></i><i class="window lit"></i></div>
        </div><div class="building-base"><span>BLOCK A / 07</span><span class="entrance"></span></div>
      </article>
      <article id="central-tower" class="building building-center" data-building="central">
        <div class="roof roof-crown"><span></span><span></span><span></span></div>
        <header class="building-sign"><span>02</span><b>NEON TOWER</b><small class="selector-label">.building-center</small></header>
        <div class="building-floors">
          <div class="floor"><i class="window   "></i><i class="window lit  "></i><i class="window  pink "></i><i class="window   teal"></i><i class="window   "></i></div><div class="floor"><i class="window lit  "></i><i class="window  pink "></i><i class="window   teal"></i><i class="window   "></i><i class="window   "></i></div><div class="floor"><i class="window  pink "></i><i class="window   teal"></i><i class="window   "></i><i class="window   "></i><i class="window lit  "></i></div><div class="floor"><i class="window   teal"></i><i class="window   "></i><i class="window   "></i><i class="window lit  "></i><i class="window   "></i></div><div class="floor"><i class="window   "></i><i class="window   "></i><i class="window lit  "></i><i class="window   "></i><i class="window   "></i></div><div class="floor"><i class="window   "></i><i class="window lit  "></i><i class="window   "></i><i class="window   "></i><i class="window  pink "></i></div><div class="floor"><i class="window lit  "></i><i class="window   "></i><i class="window   "></i><i class="window  pink "></i><i class="window   "></i></div><div class="floor"><i class="window   "></i><i class="window   "></i><i class="window  pink "></i><i class="window   "></i><i class="window lit  teal"></i></div><div class="floor"><i class="window   "></i><i class="window  pink "></i><i class="window   "></i><i class="window lit  teal"></i><i class="window   "></i></div>
        </div><div class="building-base"><span>CORE / 09</span><span class="entrance"></span></div>
      </article>
      <article class="building building-right" data-building="office">
        <div class="roof roof-flat"><span></span><span></span></div>
        <header class="building-sign"><span>03</span><b>DATA EXCHANGE</b><small class="selector-label">.building-right</small></header>
        <div class="building-floors">
          <div class="floor"><i class="window lit teal"></i><i class="window "></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window "></i><i class="window lit teal"></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window lit teal"></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window lit teal"></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window lit teal"></i><i class="window "></i><i class="window "></i><i class="window "></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window "></i><i class="window lit teal"></i></div><div class="floor"><i class="window "></i><i class="window "></i><i class="window lit teal"></i><i class="window "></i></div>
        </div><div class="building-base"><span>BLOCK C / 07</span><span class="entrance"></span></div>
      </article>
    </section>
    <div class="elevated-line" aria-hidden="true"><span></span><span></span></div>
    <div class="foreground" aria-hidden="true"><div class="street"></div><div class="street-light light-left"><i></i></div><div class="street-light light-right"><i></i></div><div class="road-mark road-mark-a"></div><div class="road-mark road-mark-b"></div><div class="road-reflection"></div></div>
    <aside class="control-terminal" aria-label="Интерактивная панель управления для упражнений по псевдоклассам">
      <div class="terminal-heading"><span>FIELD TERMINAL</span><span>NODE 04 / ONLINE</span></div>
      <form class="terminal-form" id="terminal-form" novalidate>
        <label class="terminal-field">EMAIL
          <input class="terminal-email" type="email" name="email" required placeholder="operator@nocturne.city" autocomplete="off">
        </label>
        <label class="terminal-field">NOTE
          <input class="terminal-note" type="text" name="note" placeholder="optional field">
        </label>
        <div class="terminal-controls">
          <label class="terminal-toggle"><input class="terminal-access" type="checkbox" name="access"> ACCESS</label>
          <button class="terminal-connect" type="button">CONNECT</button>
          <button class="terminal-locked" type="button" disabled>LOCKED</button>
        </div>
      </form>
    </aside>
    
  </main>
  <script>
    (() => {
      let playerStyle = document.getElementById('player-css');
      const previewStyle = document.createElement('style');
      previewStyle.textContent = '[data-nocturne-selected="true"]{outline:2px solid #60a4a1!important;outline-offset:2px!important;box-shadow:0 0 12px #60a4a188!important}';
      document.head.appendChild(previewStyle);

      const propertyAliases = {
        'border-top-width': ['border-top-width', 'border-top', 'border-width', 'border'],
        'border-top-style': ['border-top-style', 'border-top', 'border-style', 'border'],
        'border-top-color': ['border-top-color', 'border-top', 'border-color', 'border'],
        'border-right-width': ['border-right-width', 'border-right', 'border-width', 'border'],
        'border-right-style': ['border-right-style', 'border-right', 'border-style', 'border'],
        'border-right-color': ['border-right-color', 'border-right', 'border-color', 'border'],
        'border-bottom-width': ['border-bottom-width', 'border-bottom', 'border-width', 'border'],
        'border-bottom-style': ['border-bottom-style', 'border-bottom', 'border-style', 'border'],
        'border-bottom-color': ['border-bottom-color', 'border-bottom', 'border-color', 'border'],
        'border-left-width': ['border-left-width', 'border-left', 'border-width', 'border'],
        'border-left-style': ['border-left-style', 'border-left', 'border-style', 'border'],
        'border-left-color': ['border-left-color', 'border-left', 'border-color', 'border'],
        'outline-width': ['outline-width', 'outline'],
        'outline-style': ['outline-style', 'outline'],
        'outline-color': ['outline-color', 'outline'],
        'background-color': ['background-color', 'background'],
        'row-gap': ['row-gap', 'gap', 'grid-row-gap', 'grid-gap'],
        'opacity': ['opacity']
      };

      let lastHoveredElement = null;
      let lastFocusedElement = null;
      let lastFocusVisibleElement = null;
      let lastActiveElement = null;

      document.addEventListener('focusin', event => {
        lastFocusedElement = event.target;
        lastFocusVisibleElement = event.target.matches?.(':focus-visible') ? event.target : null;
        refreshSelectorPreview();
      });
      document.addEventListener('keydown', () => {
        const active = document.activeElement;
        if (active?.matches?.(':focus-visible')) lastFocusVisibleElement = active;
      }, true);
      document.addEventListener('pointerdown', event => {
        const activeButton = event.target.closest?.('.terminal-connect');
        if (activeButton) lastActiveElement = activeButton;
      }, true);
      document.getElementById('terminal-form')?.addEventListener('submit', event => event.preventDefault());
      document.addEventListener('pointerover', event => {
        const windowElement = event.target.closest?.('.window');
        if (windowElement) lastHoveredElement = windowElement;
        refreshSelectorPreview();
      });
      document.addEventListener('pointerout', refreshSelectorPreview);

      function refreshSelectorPreview() {
        document.querySelectorAll('[data-nocturne-selected]').forEach(node => node.removeAttribute('data-nocturne-selected'));
        try {
          Array.from(playerStyle?.sheet?.cssRules || []).forEach(rule => {
            if (!rule.selectorText) return;
            try {
              document.querySelectorAll(rule.selectorText).forEach(node => node.setAttribute('data-nocturne-selected', 'true'));
            } catch (error) {
              // Не имитируем псевдоклассы и псевдоэлементы удалением их условий.
            }
          });
        } catch (error) {}
      }

      function collectStyleRules(rules, result = []) {
        Array.from(rules || []).forEach(rule => {
          if (typeof rule.selectorText === 'string' && rule.style) result.push(rule);
          if (rule.cssRules) collectStyleRules(rule.cssRules, result);
        });
        return result;
      }

      function ruleDeclaresProperty(rule, property) {
        const aliases = propertyAliases[property] || [property];
        const names = Array.from({length: rule.style.length}, (_, index) => rule.style.item(index));
        return names.some(name => aliases.includes(name));
      }

      function getAppliedElements(property) {
        const applied = new Set();
        const rules = collectStyleRules(playerStyle?.sheet?.cssRules || []);
        rules.forEach(rule => {
          if (!ruleDeclaresProperty(rule, property)) return;
          try {
            document.querySelectorAll(rule.selectorText).forEach(node => applied.add(node));
          } catch (error) {
            // Селекторы псевдоэлементов не являются DOM-элементами.
          }
        });
        return applied;
      }

      function sameElements(actual, expected) {
        if (actual.size !== expected.length) return false;
        return expected.every(node => actual.has(node));
      }

      function checkPropertyRequirements(checks) {
        for (const item of checks) {
          const targets = Array.from(document.querySelectorAll(item.selector));
          if (!targets.length) return {found: false, passed: false, reason: 'target'};

          const applied = getAppliedElements(item.property);
          if (!sameElements(applied, targets)) {
            return {found: true, passed: false, reason: 'scope'};
          }

          const valuesMatch = targets.every(target =>
            getComputedStyle(target).getPropertyValue(item.property).trim() === item.expected
          );
          if (!valuesMatch) return {found: true, passed: false, reason: 'value'};
        }
        return {found: true, passed: true, reason: ''};
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent || !event.data) return;
        const data = event.data;

        if (data.type === 'NOCTURNE_APPLY_CSS') {
          if (!playerStyle) {
            playerStyle = document.createElement('style');
            playerStyle.id = 'player-css';
            document.head.appendChild(playerStyle);
          }
          playerStyle.textContent = typeof data.css === 'string' ? data.css : '';
          refreshSelectorPreview();
          return;
        }

        if (data.type !== 'NOCTURNE_CHECK_TASK' || !data.id || !data.check) return;

        let result = {passed: false, found: false};
        try {
          if (data.check.mode === 'selector') {
            const pseudoPattern = /::(before|after|first-letter|first-line|selection|placeholder)\b/g;
            const pseudoOf = selector => Array.from(new Set(selector.match(pseudoPattern) || [])).join('');
            const hostOf = selector => selector.replace(pseudoPattern, '').trim();
            const expectedSelector = data.check.selector;
            const expectedPseudo = pseudoOf(expectedSelector);
            const statePattern = /:(focus-visible|focus-within|focus|active|checked|disabled|enabled|required|optional|valid|invalid|hover)\\b/g;
            const stateOf = selector => Array.from(new Set(selector.match(statePattern) || []));
            const expectedStates = stateOf(expectedSelector);
            const stripStates = selector => selector.replace(statePattern, '');
            const expectedHost = hostOf(expectedSelector);
            const expectedBase = stripStates(expectedHost);
            const expectedNodes = Array.from(document.querySelectorAll(expectedBase));
            const sameNodeSet = (left, right) => left.length === right.length && left.every(node => right.includes(node));
            const rules = collectStyleRules(playerStyle?.sheet?.cssRules || []);
            let interactionMissing = false;
            let stateMissing = false;
            const submitted = rules.some(rule => {
              if (rule.style.length !== 0 || pseudoOf(rule.selectorText) !== expectedPseudo) return false;
              const submittedStates = stateOf(rule.selectorText);
              if (submittedStates.join('|') !== expectedStates.join('|')) return false;
              const submittedHost = stripStates(hostOf(rule.selectorText));
              let submittedNodes;
              try { submittedNodes = Array.from(document.querySelectorAll(submittedHost)); }
              catch (error) { return false; }
              if (!sameNodeSet(submittedNodes, expectedNodes)) return false;

              if (expectedStates.includes(':hover') && (!lastHoveredElement || !lastHoveredElement.matches(expectedBase))) { interactionMissing = true; return false; }
              if (expectedStates.includes(':focus') && (!lastFocusedElement || !lastFocusedElement.matches(expectedBase))) { interactionMissing = true; return false; }
              if (expectedStates.includes(':focus-visible') && (!lastFocusVisibleElement || !lastFocusVisibleElement.matches(expectedBase))) { interactionMissing = true; return false; }
              if (expectedStates.includes(':focus-within') && (!lastFocusedElement || !lastFocusedElement.closest(expectedBase))) { interactionMissing = true; return false; }
              if (expectedStates.includes(':active') && (!lastActiveElement || !lastActiveElement.matches(expectedBase))) { interactionMissing = true; return false; }
              if (expectedStates.some(state => [':checked', ':disabled', ':enabled', ':required', ':optional', ':valid', ':invalid'].includes(state))) {
                let stateMatches = [];
                try { stateMatches = Array.from(document.querySelectorAll(hostOf(rule.selectorText))); } catch (error) {}
                if (!stateMatches.length) { stateMissing = true; return false; }
              }
              if (expectedPseudo.includes('::selection') && !window.getSelection()?.toString()) { interactionMissing = true; return false; }
              const requiredTokens = Array.isArray(data.check.mustContain) ? data.check.mustContain : data.check.mustContain ? [data.check.mustContain] : [];
              if (!requiredTokens.every(token => rule.selectorText.includes(token))) return false;
              return true;
            });
            const found = expectedNodes.length > 0;
            result = {found, passed: submitted && found, reason: submitted && found ? '' : interactionMissing ? 'interaction' : stateMissing ? 'state' : 'selector'};
          } else {
            const checks = Array.isArray(data.check.checks) ? data.check.checks : [data.check];
            result = checkPropertyRequirements(checks);
          }
        } catch (error) {
          result = {passed: false, found: false};
        }

        window.parent.postMessage(
          {type: 'NOCTURNE_TASK_RESULT', id: data.id, passed: result.passed, found: result.found, reason: result.reason},
          event.origin === 'null' ? '*' : event.origin
        );
      });
    })();
  </script>
</body>
</html>
