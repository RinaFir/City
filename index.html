<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e1122">
  <title>NOCTURNE CSS City</title>
  <link rel="stylesheet" href="./styles.css?v=d28ca17">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">NOCTURNE <span>CSS CITY</span></a>
    
  </header>
  <main class="app">
    <nav class="topics" aria-label="Темы CSS">
      <button class="topic" data-topic="frame"><b>01</b><span>Рамки</span></button>
      <button class="topic" data-topic="outline"><b>02</b><span>Внешний контур</span></button>
      <button class="topic active" data-topic="selectors"><b>03</b><span>Селекторы</span></button>
      <button class="topic" data-topic="pseudoClasses"><b>04</b><span>Псевдоклассы</span></button>
      <button class="topic" data-topic="pseudoElements"><b>05</b><span>Псевдоэлементы</span></button>
      <button class="topic" data-topic="colors"><b>06</b><span>Цвет и фон</span></button>
      <button class="topic" data-topic="spacing"><b>07</b><span>Отступы и промежутки</span></button>
      <button class="topic" data-topic="effects"><b>08</b><span>Эффекты</span></button>
      
    </nav>
    <section class="workspace">
      <section class="scene-panel">
        <div class="panel-heading"><div><span class="kicker" id="topic-kicker">ТЕМА 01</span><h1 id="topic-title">Селекторы</h1></div></div>
        <iframe class="city-frame" src="./scenes/city/index.html?v=form-state-controls-20261128-1" title="Городская сцена"></iframe>
        <section class="class-map" aria-labelledby="city-legend-title">
          <div class="class-map-head">
            <strong id="city-legend-title">Легенда города</strong>
            <span>Все обозначения сцены и заданий. Нажми на запись, чтобы вставить селектор в редактор.</span>
          </div>
          <div id="city-legend" class="city-legend" aria-live="polite"></div>
        </section>
      </section>
      <aside class="task-panel">
        <div class="task-top"><span class="kicker">ПРАКТИКА</span><span id="task-count">01 / 13</span></div>
        <h2 id="task-title">Выбери элемент</h2>
        <p id="task-prompt">Выбери класс здания в списке и измени его стиль.</p>
        
        
        <textarea id="css-input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder=".building-left {&#10;  &#10;}"></textarea>
        <div class="editor-actions">
          <button id="reset" class="button secondary">Сбросить</button>
          <button id="previous" class="button secondary" disabled>Назад</button>
          <button id="skip" class="button secondary">Следующее</button>
          <button id="check" class="button primary">Проверить</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Изменения сразу видны в городе.</p>
        <details class="reference"><summary>Справочник CSS</summary><div id="reference-content" class="reference-content"></div></details>
        <details class="help"><summary>Подсказка</summary><p id="hint"></p></details>
        <details class="help"><summary>Показать решение</summary><pre id="solution"></pre><button id="insert" class="button secondary">Вставить в редактор</button></details>
        <div class="task-progress"><span id="progress"></span></div>
      </aside>
    </section>
  </main>
  <script src="./city-editor.js?v=form-state-controls-20261128-1"></script>
</body>
</html>
